<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0f172a;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background:
          radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.38), transparent 34%),
          radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.28), transparent 34%),
          linear-gradient(135deg, #020617 0%, #0f172a 48%, #111827 100%);
        color: white;
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.08;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.16) 1px, transparent 1px);
        background-size: 52px 52px;
      }

      .orb {
        position: absolute;
        width: 34vw;
        height: 34vw;
        border-radius: 999px;
        right: -8vw;
        top: -8vw;
        background: rgba(129, 140, 248, 0.28);
        filter: blur(10px);
      }

      .panel {
        position: absolute;
        left: 7vw;
        top: 14vh;
        width: min(760px, 72vw);
        padding: clamp(28px, 4vw, 58px);
        border-radius: 42px;
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.16);
        box-shadow: 0 40px 130px rgba(0, 0, 0, 0.34);
        backdrop-filter: blur(18px);
      }

      .badge {
        display: inline-flex;
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(129, 140, 248, 0.18);
        color: #c7d2fe;
        font-size: clamp(16px, 1.6vw, 24px);
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .title {
        margin-top: 28px;
        font-size: clamp(58px, 8vw, 118px);
        line-height: 0.9;
        letter-spacing: -0.07em;
        font-weight: 950;
      }

      .title span {
        color: #a5b4fc;
      }

      .subtitle {
        margin-top: 26px;
        width: min(620px, 64vw);
        color: rgba(255, 255, 255, 0.68);
        font-size: clamp(22px, 2.1vw, 34px);
        line-height: 1.32;
        font-weight: 500;
      }

      .chips {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        margin-top: 34px;
      }

      .chip {
        padding: 12px 16px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.78);
        font-size: clamp(14px, 1.4vw, 20px);
        font-weight: 700;
      }

      .floating-card {
        position: absolute;
        right: 7vw;
        bottom: 16vh;
        width: min(360px, 34vw);
        padding: 26px;
        border-radius: 32px;
        background: white;
        color: #111827;
        box-shadow: 0 34px 100px rgba(0, 0, 0, 0.28);
      }

      .floating-card .label {
        color: #64748b;
        font-size: clamp(14px, 1.3vw, 20px);
        font-weight: 800;
      }

      .floating-card .value {
        margin-top: 12px;
        font-size: clamp(42px, 5vw, 72px);
        line-height: 0.9;
        letter-spacing: -0.06em;
        font-weight: 950;
      }

      .progress-wrap {
        position: absolute;
        left: 7vw;
        right: 7vw;
        bottom: 7vh;
        height: 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.14);
        overflow: hidden;
      }

      .progress {
        height: 100%;
        width: 0%;
        border-radius: 999px;
        background: #818cf8;
      }

      .frame {
        position: absolute;
        right: 7vw;
        top: 7vh;
        color: rgba(255, 255, 255, 0.56);
        font-size: clamp(16px, 1.5vw, 24px);
        font-weight: 800;
      }
    </style>
  </head>

  <body>
    <div class="scene">
      <div class="grain"></div>
      <div class="orb"></div>

      <div class="frame">Frame 0</div>

      <div class="panel">
        <div class="badge">Remotion HTML Test</div>
        <div class="title">Paste code.<br /><span>Render video.</span></div>
        <div class="subtitle">
          This full HTML/CSS/JS file is controlled by the Remotion frame timeline.
        </div>

        <div class="chips">
          <div class="chip">HTML</div>
          <div class="chip">CSS</div>
          <div class="chip">JS</div>
          <div class="chip">Frame-aware</div>
        </div>
      </div>

      <div class="floating-card">
        <div class="label">Timeline progress</div>
        <div class="value">0%</div>
      </div>

      <div class="progress-wrap">
        <div class="progress"></div>
      </div>
    </div>

    <script>
      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value))
      }

      function easeOutCubic(t) {
        return 1 - Math.pow(1 - t, 3)
      }

      window.remotionRender = function (ctx) {
        const { frame, progress } = ctx

        const panel = document.querySelector(".panel")
        const floatingCard = document.querySelector(".floating-card")
        const orb = document.querySelector(".orb")
        const progressBar = document.querySelector(".progress")
        const frameText = document.querySelector(".frame")
        const value = document.querySelector(".value")
        const chips = document.querySelectorAll(".chip")

        const intro = easeOutCubic(clamp(frame / 36, 0, 1))
        const cardIn = easeOutCubic(clamp((frame - 24) / 34, 0, 1))
        const orbMove = progress * 160

        panel.style.opacity = String(intro)
        panel.style.transform = `translateY(${(1 - intro) * 70}px) scale(${
          0.96 + intro * 0.04
        })`

        floatingCard.style.opacity = String(cardIn)
        floatingCard.style.transform = `translateY(${(1 - cardIn) * 80}px) rotate(${
          (1 - cardIn) * 5
        }deg)`

        orb.style.transform = `translate(${-orbMove}px, ${orbMove * 0.45}px) scale(${
          1 + progress * 0.25
        })`

        progressBar.style.width = `${progress * 100}%`
        value.textContent = `${Math.round(progress * 100)}%`
        frameText.textContent = `Frame ${frame}`

        chips.forEach((chip, index) => {
          const chipIn = easeOutCubic(clamp((frame - 38 - index * 5) / 18, 0, 1))
          chip.style.opacity = String(chipIn)
          chip.style.transform = `translateY(${(1 - chipIn) * 18}px)`
        })
      }
    </script>
  </body>
</html>
