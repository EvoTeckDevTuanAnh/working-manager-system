<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f3f0ea;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      .scene {
        position: relative;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        color: #171717;
        background:
          linear-gradient(90deg, rgba(243, 240, 234, 0.94), rgba(243, 240, 234, 0.7)),
          url("./assets/main-cover.jpg");
        background-size: cover;
        background-position: center;
      }

      .noise {
        position: absolute;
        inset: 0;
        opacity: 0.08;
        background-image:
          linear-gradient(rgba(0, 0, 0, 0.18) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 0, 0, 0.18) 1px, transparent 1px);
        background-size: 48px 48px;
      }

      .left {
        position: absolute;
        left: 7vw;
        top: 12vh;
        width: min(720px, 62vw);
      }

      .tag {
        display: inline-flex;
        padding: 10px 15px;
        border: 1px solid rgba(23, 23, 23, 0.14);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.56);
        font-size: clamp(14px, 1.2vw, 19px);
        font-weight: 850;
        letter-spacing: 0.1em;
        text-transform: uppercase;
      }

      .title {
        margin-top: 28px;
        font-size: clamp(64px, 8vw, 122px);
        line-height: 0.86;
        letter-spacing: -0.08em;
        font-weight: 950;
      }

      .title em {
        color: #9f1239;
        font-style: normal;
      }

      .desc {
        margin-top: 28px;
        width: min(560px, 52vw);
        color: rgba(23, 23, 23, 0.64);
        font-size: clamp(22px, 2vw, 31px);
        line-height: 1.32;
        font-weight: 520;
      }

      .cta {
        margin-top: 36px;
        display: inline-flex;
        align-items: center;
        gap: 12px;
        padding: 16px 22px;
        border-radius: 999px;
        background: #171717;
        color: white;
        font-size: clamp(16px, 1.3vw, 21px);
        font-weight: 850;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.24);
      }

      .cta-dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #fb7185;
      }

      .cards {
        position: absolute;
        right: 6vw;
        top: 12vh;
        width: min(640px, 43vw);
        height: 74vh;
      }

      .card {
        position: absolute;
        width: 44%;
        height: 42%;
        overflow: hidden;
        border-radius: 34px;
        background: white;
        border: 1px solid rgba(23, 23, 23, 0.1);
        box-shadow: 0 34px 100px rgba(23, 23, 23, 0.18);
        transform-origin: center;
      }

      .card img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      .card::after {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(0deg, rgba(0, 0, 0, 0.28), transparent 50%);
      }

      .card-label {
        position: absolute;
        left: 16px;
        bottom: 16px;
        z-index: 2;
        padding: 8px 11px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.78);
        color: #171717;
        font-size: 13px;
        font-weight: 850;
        backdrop-filter: blur(14px);
      }

      .card-1 {
        left: 0;
        top: 4%;
      }

      .card-2 {
        right: 2%;
        top: 22%;
      }

      .card-3 {
        left: 17%;
        bottom: 0;
      }

      .counter {
        position: absolute;
        left: 7vw;
        bottom: 6vh;
        color: rgba(23, 23, 23, 0.42);
        font-size: clamp(16px, 1.35vw, 22px);
        font-weight: 850;
      }

      .bar-wrap {
        position: absolute;
        right: 6vw;
        bottom: 6vh;
        width: min(520px, 38vw);
        height: 8px;
        border-radius: 999px;
        overflow: hidden;
        background: rgba(23, 23, 23, 0.12);
      }

      .bar {
        width: 0%;
        height: 100%;
        border-radius: 999px;
        background: #9f1239;
      }
    </style>
  </head>

  <body>
    <div class="scene">
      <div class="noise"></div>

      <section class="left">
        <div class="tag">Visual Asset System</div>
        <div class="title">Swap images.<br /><em>Keep motion.</em></div>
        <div class="desc">
          Upload your own visuals into every detected asset slot without editing
          the HTML by hand.
        </div>
        <div class="cta">
          <span class="cta-dot"></span>
          Render with your assets
        </div>
      </section>

      <section class="cards">
        <div class="card card-1">
          <img src="./assets/product-1.png" alt="Product 1" />
          <div class="card-label">Asset 01</div>
        </div>

        <div class="card card-2">
          <img src="./assets/product-2.png" alt="Product 2" />
          <div class="card-label">Asset 02</div>
        </div>

        <div class="card card-3">
          <img src="./assets/product-3.png" alt="Product 3" />
          <div class="card-label">Asset 03</div>
        </div>
      </section>

      <div class="counter">4 detected assets expected</div>

      <div class="bar-wrap">
        <div class="bar"></div>
      </div>
    </div>

    <script>
      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value))
      }

      function easeOut(t) {
        return 1 - Math.pow(1 - t, 3)
      }

      function easeInOut(t) {
        return t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2
      }

      window.remotionRender = function (ctx) {
        const { frame, progress } = ctx

        const left = document.querySelector(".left")
        const cards = document.querySelectorAll(".card")
        const cta = document.querySelector(".cta")
        const counter = document.querySelector(".counter")
        const bar = document.querySelector(".bar")
        const scene = document.querySelector(".scene")

        const intro = easeOut(clamp(frame / 34, 0, 1))
        const ctaIn = easeOut(clamp((frame - 28) / 22, 0, 1))

        left.style.opacity = String(intro)
        left.style.transform = `translateY(${(1 - intro) * 62}px)`

        cta.style.opacity = String(ctaIn)
        cta.style.transform = `translateY(${(1 - ctaIn) * 24}px)`

        cards.forEach((card, index) => {
          const enter = easeOut(clamp((frame - 14 - index * 10) / 34, 0, 1))
          const drift = Math.sin(progress * Math.PI * 2 + index * 1.4) * 16
          const rotateBase = [-7, 5, -3][index] || 0

          card.style.opacity = String(enter)
          card.style.transform = `translateY(${(1 - enter) * 90 + drift}px) rotate(${
            rotateBase * enter
          }deg) scale(${0.9 + enter * 0.1})`
        })

        counter.style.opacity = String(clamp((frame - 48) / 22, 0, 1))
        bar.style.width = `${easeInOut(progress) * 100}%`

        scene.style.backgroundPosition = `${50 + progress * 8}% center`
      }
    </script>
  </body>
</html>
